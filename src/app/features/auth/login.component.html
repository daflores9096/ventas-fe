<div class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">

    <h2 class="text-2xl font-bold text-center mb-6">Iniciar Sesión</h2>

    <form (ngSubmit)="doLogin()">
      <div class="mb-4">
        <label class="block mb-1 font-semibold">Usuario</label>
        <input [(ngModel)]="username" name="username" class="w-full p-2 border rounded" />
      </div>

      <div class="mb-4">
        <label class="block mb-1 font-semibold">Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" class="w-full p-2 border rounded" />
      </div>

      <button class="w-full bg-blue-600 text-white p-2 rounded">
        Entrar
      </button>
    </form>

    @if (error) {
      <p class="text-red-500 mt-4 text-center">{{ error }}</p>
    }

  </div>
</div>
